<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CreditStar - Official Site</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            background-color: #F2F2F7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #1C1C1E;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; }
        p { color: #8E8E93; margin-bottom: 30px; font-size: 15px; }
        
        .btn {
            display: block;
            background-color: #F2F2F7;
            color: #007AFF;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #E5E5EA; }
        
        /* 增加一个主要按钮样式用于联系支持 */
        .btn.primary {
            background-color: #007AFF;
            color: white;
        }
        .btn.primary:hover { background-color: #0062CC; }

        .footer { margin-top: 30px; font-size: 12px; color: #C7C7CC; }
    </style>
</head>
<body>

<div class="card">
    <span class="icon">🌟</span>
    <h1>CreditStar</h1>
    <p>Credit Card Rewards Manager<br>信用卡回贈之星</p>

    <a href="mailto:support@creditstar.app" class="btn primary">Contact Support (聯絡我們)</a>

    <a href="privacy.html" class="btn">Privacy Policy (隱私政策)</a>
    <a href="terms.html" class="btn">Terms of Use (使用條款)</a>
    
    <div class="footer">
        &copy; 2026 CreditStar Team. All rights reserved.
    </div>
</div>

</body>
</html>
